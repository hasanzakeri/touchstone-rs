name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # Default types plus ready_for_review, so CI runs when a draft graduates;
    # draft PRs themselves are skipped via the job-level `if` guards.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Invokes the tools directly rather than through pre-commit: that config
  # also carries commit-workflow guards such as no-commit-to-branch, which
  # fails once the branch reaches main because actions/checkout puts HEAD on
  # refs/heads/main for a push. Both tools come from the dev group, so uv.lock
  # still pins one version for CI and for the hooks.
  lint:
    name: lint (ruff + pyright)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # UV_NO_SYNC keeps each `uv run` on the environment synced below instead of
    # quietly reinstalling the project, which would drag in a Rust toolchain.
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      # --no-install-project keeps the Rust extension out of this job: pyright
      # resolves the package through [tool.pyright] extraPaths and the
      # checked-in _core.pyi stub, so nothing here needs compiling.
      - run: uv sync --no-install-project

      # --no-fix and --check because CI reports, it does not rewrite.
      - name: ruff check
        run: uv run ruff check --no-fix

      - name: ruff format
        run: uv run ruff format --check --diff

      - name: pyright
        run: uv run pyright

  rust:
    name: rust checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: pytest (py${{ matrix.python }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest

  wheel-linux:
    name: abi3 wheel (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux
          path: dist/*.whl

  # macOS runners are scarce/slow and Windows adds little signal per commit
  # for a text parser; native wheels are verified on tags and manual runs.
  # Spelled out rather than a matrix so the skipped checks on a PR still read
  # as an OS name instead of an uninterpolated `${{ matrix.os }}`.
  wheel-macos:
    name: abi3 wheel (macos)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos
          path: dist/*.whl

  wheel-windows:
    name: abi3 wheel (windows)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows
          path: dist/*.whl
