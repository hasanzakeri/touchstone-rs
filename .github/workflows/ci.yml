name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # Default types plus ready_for_review, so CI runs when a draft graduates;
    # draft PRs themselves are skipped via the job-level `if` guards.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ruff and pyright are driven through .pre-commit-config.yaml rather than
  # re-declared here, so a hook version bump reaches CI and developer machines
  # at the same time. Only pre-commit-stage hooks run, which leaves clippy,
  # cargo test and pytest to the jobs below; cargo fmt is skipped because the
  # rust job already covers it and a toolchain install just for it is not worth
  # the runner minute.
  lint:
    name: lint (ruff + pyright)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      # --no-install-project keeps the Rust extension out of this job: pyright
      # resolves the package through [tool.pyright] extraPaths and the
      # checked-in _core.pyi stub, so nothing here needs compiling. UV_NO_SYNC
      # stops the nested `uv run pyright` in the hook from reinstating it.
      - run: uv sync --no-install-project
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          UV_NO_SYNC: "1"
          SKIP: cargo-fmt

  rust:
    name: rust checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: pytest (py${{ matrix.python }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest

  wheel-linux:
    name: abi3 wheel (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux
          path: dist/*.whl

  # macOS runners are scarce/slow and Windows adds little signal per commit
  # for a text parser; native wheels are verified on tags and manual runs.
  # Spelled out rather than a matrix so the skipped checks on a PR still read
  # as an OS name instead of an uninterpolated `${{ matrix.os }}`.
  wheel-macos:
    name: abi3 wheel (macos)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos
          path: dist/*.whl

  wheel-windows:
    name: abi3 wheel (windows)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows
          path: dist/*.whl
