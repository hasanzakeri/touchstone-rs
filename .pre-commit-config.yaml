# Fast hygiene checks run at commit time; the expensive suite runs at push time.
# Install both stages with: uv run pre-commit install
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # tests/data holds verbatim tool output. Trailing whitespace and a
      # missing final newline are part of what a real exporter emits -- the
      # Skyworks files in the local harness end their rows with tabs -- so a
      # fixture that has been tidied is no longer evidence of what we can
      # read. Both hooks skip it; the README there documents each file's
      # provenance instead.
      - id: trailing-whitespace
        exclude: ^tests/data/
      - id: end-of-file-fixer
        exclude: ^tests/data/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      # ruff and pyright run from the dev group rather than a mirror repo, so
      # uv.lock is the single version pin and CI cannot drift from what runs
      # here. Bump them with `uv lock --upgrade-package ruff`.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Reads its include list and strictness from [tool.pyright] in
      # pyproject.toml, so it checks the whole package rather than the
      # staged subset -- hence pass_filenames: false.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
