[package]
name = "touchstone-py"
description = "Python bindings for touchstone-core (published on PyPI as touchstone-rs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Distributed via PyPI wheels, not crates.io.
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
touchstone-core.workspace = true
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
numpy = "0.29"
