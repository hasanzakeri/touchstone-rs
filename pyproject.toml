[build-system]
# >=1.13.2 required for pyo3 0.29 handling; 1.14 fixes abi3 feature handling
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "touchstone-rs"
version = "0.1.0"
description = "Fast Touchstone (.sNp) file I/O for Python, backed by a Rust parser"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Hasan Zakeri" }]
keywords = ["touchstone", "s-parameters", "rf", "snp", "scikit-rf"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/hasanzakeri/touchstone-rs"
Issues = "https://github.com/hasanzakeri/touchstone-rs/issues"

[dependency-groups]
dev = [
    "maturin>=1.14,<2",
    "pytest>=8",
    "pre-commit>=4",
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]

[tool.maturin]
manifest-path = "crates/touchstone-py/Cargo.toml"
module-name = "touchstone_rs._core"
python-source = "python"

[tool.uv]
# Rebuild the extension when Rust sources change, not just pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.ruff]
# ruff formats python blocks inside markdown as of 0.16, which would collapse
# the column-aligned comments in the README's API example. Documentation is
# not source; keeping it excluded also means a bare `ruff format` covers the
# same files the pre-commit hooks pass in.
extend-exclude = ["*.md"]

[tool.pyright]
include = ["python", "tests/python"]
# Resolve the package from the source tree so the stubs under review are the
# ones being checked, rather than whatever build is installed in the venv.
extraPaths = ["python"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
# `_core` is a compiled Rust extension; `_core.pyi` is its only source form.
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
